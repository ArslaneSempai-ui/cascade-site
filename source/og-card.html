<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>og-card : la carte de partage, capturée en 1200x630 vers og.png</title>
<link rel="stylesheet" href="fontes/literata.css">
<link rel="stylesheet" href="fontes/roboto-mono.css">
<style>
  :root{--nuit-a:#1b3229;--nuit-b:#14251e;--nuit-c:#0e1a15;--sur-vert:#e4ecdf;
    --sur-vert-pale:#a9bdaf;--vert-vif:#57b184;--vert-clair:#a5f7cb}
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;overflow:hidden;display:flex;align-items:center;
    background:radial-gradient(130% 120% at 30% -20%,var(--nuit-a),var(--nuit-b) 55%,var(--nuit-c));
    color:var(--sur-vert);font-family:"Literata",Georgia,serif}
  .g{flex:1;padding:0 0 0 84px;position:relative;z-index:2}
  .marque{font-weight:700;font-size:26px;letter-spacing:.02em}
  h1{font-size:70px;font-weight:600;letter-spacing:-.02em;line-height:1.06;margin:22px 0 26px;
    max-width:10ch}
  .sceau{font-family:"Roboto Mono",monospace;font-size:15px;letter-spacing:.06em;
    color:var(--sur-vert-pale)}
  .sceau b{color:var(--vert-clair);font-weight:500}
  .d{width:560px;flex:none;align-self:stretch;position:relative}
  .d img{position:absolute;right:-60px;top:50%;transform:translateY(-50%);width:660px;
    border-radius:18px;box-shadow:0 40px 100px rgba(0,0,0,.55)}
</style></head>
<body>
  <div class="g">
    <span class="marque">CASCADE</span>
    <h1>Where should the next dollar go?</h1>
    <p class="sceau">measured, then frozen &#183; <b>seal 1151f5a1cfaae0c0</b><br>
      on your records, on your machine</p>
  </div>
  <div class="d"><img src="rendus/robot-p1.jpg" alt=""></div>
</body></html>
